<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Year 7 Maths Mastery · Units 1–3 (Core) · Interactive Practice</title>
<style>
  :root{
    --bg:#eef2f9; --card:#fff; --ink:#15203b; --muted:#5b6785; --line:#dfe5f1;
    --brand:#4f46e5; --brand2:#7c3aed;
    --ok:#0f7a58; --okbg:#e6f7f0; --no:#c0283b; --nobg:#fdecef;
    --warn:#a86a00; --warnbg:#fff4e0; --radius:16px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.5; font-size:16px;
  }
  /* ---------- header ---------- */
  .top{background:linear-gradient(120deg,#312e81,#4f46e5 55%,#7c3aed); color:#fff; box-shadow:0 4px 18px rgba(40,30,110,.25);}
  .top-in{max-width:1400px;margin:0 auto;padding:14px 22px;display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap}
  .brand{display:flex;gap:14px;align-items:center}
  .logo{width:44px;height:44px;border-radius:12px;background:#fff;color:#4f46e5;display:grid;place-items:center;font-weight:800;font-size:1.35rem;box-shadow:0 2px 8px rgba(0,0,0,.2)}
  .brand h1{margin:0;font-size:1.15rem;letter-spacing:.2px}
  .sub{margin:2px 0 0;font-size:.82rem;opacity:.85}
  .progress{min-width:250px}
  .bar{height:9px;border-radius:99px;background:rgba(255,255,255,.25);overflow:hidden}
  .bar span{display:block;height:100%;width:0%;background:linear-gradient(90deg,#a5f3fc,#86efac);transition:width .4s ease}
  .ptext{font-size:.78rem;opacity:.9;margin-top:6px}
  /* ---------- layout ---------- */
  .layout{max-width:1400px;margin:0 auto;padding:20px;display:grid;grid-template-columns:252px 1fr;gap:20px;align-items:start}
  @media (max-width:940px){ .layout{grid-template-columns:1fr;padding:12px;gap:12px} }
  /* ---------- side nav ---------- */
  .side{background:#fff;border-radius:var(--radius);box-shadow:0 8px 24px rgba(20,30,70,.07);padding:14px;position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto}
  @media (max-width:940px){ .side{position:static;max-height:none} }
  .side h2{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:14px 0 8px}
  .side h2:first-child{margin-top:0}
  .navgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
  .navbtn{position:relative;border:2px solid var(--line);background:#fbfcff;border-radius:10px;height:38px;font:inherit;font-weight:600;font-size:.9rem;color:var(--muted);cursor:pointer;transition:.15s}
  .navbtn:hover{border-color:#b9c3f0;color:var(--brand);background:#f3f5ff}
  .navbtn.active{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 4px 12px rgba(79,70,229,.35)}
  .navbtn.done::after{content:"";position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 2px #fff}
  .navbtn.active.done::after{box-shadow:0 0 0 2px var(--brand)}
  /* ---------- card ---------- */
  .card{background:var(--card);border-radius:var(--radius);box-shadow:0 12px 34px rgba(20,30,70,.09);overflow:hidden}
  .qhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 24px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#fbfcff,#f2f6ff)}
  .qnum{font-size:1.25rem;font-weight:800}
  .qtopic{font-size:.85rem;color:var(--muted);margin-left:8px}
  .qmeta{display:flex;gap:8px}
  .pill{font-size:.72rem;font-weight:700;letter-spacing:.03em;padding:4px 10px;border-radius:99px;background:#e8ecff;color:#4338ca;text-transform:uppercase}
  .pill.marks{background:#fff0e0;color:#b45309}
  .qbody{padding:22px 24px 6px;font-size:1.03rem}
  .qlead{margin:0 0 14px}
  .qnote{font-size:.84rem;color:var(--muted);margin:-6px 0 14px}
  /* static option chips in the question */
  .chips{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0 18px}
  .chips.static span{border:2px dashed #c7d0ea;border-radius:12px;padding:8px 18px;font-weight:600;background:#fbfcff}
  .cmp-grid{display:inline-grid;gap:10px;margin:4px 0 16px}
  .cmp-row{display:grid;grid-template-columns:150px 40px 150px;align-items:center;gap:8px;font-size:1.05rem}
  .cmp-row .slot{display:grid;place-items:center;border:2px dashed #c7d0ea;border-radius:8px;height:34px;color:#9aa6c8}
  .qsub{font-weight:700;margin:16px 0 4px}
  /* ---------- panels ---------- */
  .panels{display:grid;grid-template-columns:1fr 1fr}
  @media (max-width:1040px){ .panels{grid-template-columns:1fr} }
  .panel{padding:20px 24px 26px}
  .panel.solution{border-right:1px solid var(--line);background:#fcfdff}
  @media (max-width:1040px){ .panel.solution{border-right:none;border-bottom:1px solid var(--line)} }
  .panel-h{display:flex;align-items:center;gap:8px;margin:0 0 14px;font-size:1rem;letter-spacing:.01em}
  .panel-h .ic{font-size:1.05rem}
  .panel-h .tag{margin-left:auto;font-size:.7rem;font-weight:700;color:var(--muted);background:#eef1fa;padding:3px 8px;border-radius:99px;text-transform:uppercase;letter-spacing:.06em}
  /* ---------- worked solution ---------- */
  .sol-step{display:none;gap:12px;margin-bottom:14px;animation:fade .35s ease}
  .sol-step.show{display:flex}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .sol-num{flex:0 0 28px;height:28px;border-radius:50%;background:#e8ecff;color:#4338ca;display:grid;place-items:center;font-weight:800;font-size:.82rem;margin-top:2px}
  .sol-body{flex:1;font-size:.97rem}
  .sol-body p{margin:0 0 8px}
  .sol-body p:last-child{margin-bottom:0}
  .answer{display:inline-block;background:var(--okbg);color:var(--ok);font-weight:800;padding:6px 14px;border-radius:10px;border:2px solid #b8e8d5}
  .sol-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
  .sol-done{font-size:.85rem;color:var(--ok);font-weight:700}
  /* tables & diagrams */
  table.pv{border-collapse:collapse;margin:8px 0 12px;font-size:.92rem}
  table.pv th,table.pv td{border:1px solid var(--line);padding:6px 12px;text-align:center}
  table.pv th{background:#f2f5ff;font-weight:700;color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.04em}
  table.pv td.hl{background:#fff2cc;font-weight:800;color:#b45309}
  table.pv td.dot{color:#9aa6c8}
  pre.arith{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:#f6f8ff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:.95rem;line-height:1.35;overflow-x:auto;margin:8px 0}
  .diagram{max-width:100%;height:auto;background:#fff;border:1px solid var(--line);border-radius:12px;margin:8px 0;padding:6px}
  .nl-label{font:600 15px system-ui,sans-serif;fill:#334155}
  .tree-label{font:700 15px system-ui,sans-serif;fill:#1e293b}
  .tree-leaf{font:700 15px system-ui,sans-serif;fill:#4338ca}
  ul.tight{margin:6px 0 10px;padding-left:20px}
  ul.tight li{margin:3px 0}
  /* ---------- practice ---------- */
  .ptip{font-size:.82rem;color:var(--muted);background:#f4f6fd;border-left:3px solid #c7d0ea;padding:8px 12px;border-radius:8px;margin-bottom:14px}
  .pstat{background:linear-gradient(180deg,#f5f7ff,#eef2ff);border:1px solid #dde4fa;border-radius:12px;padding:12px 14px;margin-bottom:16px;font-weight:600}
  .ptag{display:block;font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:#6366f1;margin-bottom:4px;font-weight:800}
  .pstep{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px;box-shadow:0 2px 8px rgba(20,30,70,.04)}
  .pstep.done{background:#fbfffd;border-color:#c8ebdd}
  .pstep-h{margin-bottom:6px}
  .badge{display:inline-block;font-size:.68rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:#e8ecff;color:#4338ca;padding:3px 9px;border-radius:99px}
  .pstep-q,.qitem-q{font-weight:600;margin-bottom:10px}
  .opts{display:grid;gap:8px}
  .opt{display:block;width:100%;text-align:left;padding:10px 14px;border:2px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;font:inherit;font-size:.96rem;transition:.15s;color:var(--ink)}
  .opt:hover:not(:disabled){border-color:#b9c3f0;background:#f7f8ff;transform:translateX(2px)}
  .opt:disabled{cursor:default}
  .opt.correct{border-color:var(--ok);background:var(--okbg);color:var(--ok);font-weight:700}
  .opt.wrong{border-color:var(--no);background:var(--nobg);color:var(--no);animation:shake .3s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
  .fb{display:flex;gap:9px;margin-top:10px;padding:10px 12px;border-radius:10px;font-size:.9rem;line-height:1.45}
  .fb.ok{background:var(--okbg);color:var(--ok);border-left:4px solid var(--ok)}
  .fb.no{background:var(--nobg);color:var(--no);border-left:4px solid var(--no)}
  .fb .fbi{font-weight:900}
  .qitem{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px}
  .qitem-h{margin-bottom:6px}
  /* multi-select */
  .chips.pick{display:flex;flex-wrap:wrap;gap:9px;margin:12px 0}
  .mchip{border:2px solid var(--line);background:#fbfcff;border-radius:12px;padding:9px 18px;font:inherit;font-weight:700;cursor:pointer;transition:.15s;color:var(--ink)}
  .mchip:hover:not(:disabled){border-color:#b9c3f0;background:#f3f5ff}
  .mchip.sel{background:#e8ecff;border-color:var(--brand);color:var(--brand)}
  .mchip.m-correct{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
  .mchip.m-missed{background:var(--warnbg);border-color:#eab308;color:var(--warn)}
  .mchip.m-wrong{background:var(--nobg);border-color:var(--no);color:var(--no)}
  .mchip:disabled{cursor:default}
  /* buttons */
  .btn{font:inherit;font-weight:700;border-radius:11px;padding:10px 18px;cursor:pointer;border:2px solid transparent;transition:.15s}
  .btn.primary{background:var(--brand);color:#fff;box-shadow:0 4px 14px rgba(79,70,229,.3)}
  .btn.primary:hover{background:#4338ca;transform:translateY(-1px)}
  .btn.ghost{background:#fff;border-color:var(--line);color:var(--muted)}
  .btn.ghost:hover{border-color:#b9c3f0;color:var(--brand)}
  .btn.check{margin-top:4px}
  /* footer */
  .qfoot{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 24px;border-top:1px solid var(--line);background:#fafbff}
  .qfoot .mid{font-size:.82rem;color:var(--muted)}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="brand">
      <div class="logo">7</div>
      <div>
        <h1>Maths Mastery · Units 1–3 · Core</h1>
        <p class="sub">Year 7 · Core (2026-27) · 30 questions · 51 marks · 45 minutes</p>
      </div>
    </div>
    <div class="progress">
      <div class="bar"><span id="barFill"></span></div>
      <div class="ptext"><span id="doneCount">0</span> of 30 questions practised</div>
    </div>
  </div>
</header>

<div class="layout">
  <nav class="side" id="side" aria-label="Question navigation"></nav>
  <main id="main"></main>
</div>

<script>
/* =========================================================
   HELPERS
   ========================================================= */
const fmt = n => String(Math.round(n * 1000) / 1000);

function numberLineSVG({min = 2.5, max = 3.0, steps = 5, labels = [], arrow = 0} = {}){
  const w = 620, x0 = 40, x1 = w - 40, y = 74;
  const gap = (x1 - x0) / steps;
  const xs = i => x0 + i * gap;
  let ticks = "";
  for (let i = 0; i <= steps; i++){
    ticks += `<line x1="${xs(i)}" y1="${y - 12}" x2="${xs(i)}" y2="${y + 12}" stroke="#94a3b8" stroke-width="2"/>`;
  }
  let labs = "";
  labels.forEach(i => {
    const v = min + i * (max - min) / steps;
    labs += `<text x="${xs(i)}" y="${y + 38}" text-anchor="middle" class="nl-label">${fmt(v)}</text>`;
  });
  let arrowSvg = "";
  if (arrow !== null && arrow !== undefined){
    const ax = xs(arrow);
    arrowSvg = `<line x1="${ax}" y1="6" x2="${ax}" y2="${y - 20}" stroke="#4f46e5" stroke-width="3"/>
      <polygon points="${ax - 7},${y - 28} ${ax + 7},${y - 28} ${ax},${y - 10}" fill="#4f46e5"/>`;
  }
  return `<svg viewBox="0 0 ${w} 118" class="diagram" role="img" aria-label="Number line">
    <line x1="${x0}" y1="${y}" x2="${x1}" y2="${y}" stroke="#334155" stroke-width="2.5"/>
    ${ticks}${labs}${arrowSvg}
  </svg>`;
}

/* Completed factor tree for 80, as hinted in the Core paper
   (80 → 2 and 40; 40 → 4 and 10; 4 → 2 and 2; 10 → 2 and 5) */
const factorTreeCore = `
<svg viewBox="0 0 560 300" class="diagram" role="img" aria-label="Completed factor tree for 80">
  <g stroke="#94a3b8" stroke-width="2">
    <line x1="260" y1="52" x2="160" y2="92"/>
    <line x1="260" y1="52" x2="360" y2="92"/>
    <line x1="360" y1="118" x2="300" y2="158"/>
    <line x1="360" y1="118" x2="430" y2="158"/>
    <line x1="300" y1="184" x2="270" y2="226"/>
    <line x1="300" y1="184" x2="335" y2="226"/>
    <line x1="430" y1="184" x2="400" y2="226"/>
    <line x1="430" y1="184" x2="465" y2="226"/>
  </g>
  <circle cx="160" cy="104" r="19" fill="none" stroke="#4f46e5" stroke-width="2.5"/>
  <text x="260" y="46" text-anchor="middle" class="tree-label">80</text>
  <text x="160" y="110" text-anchor="middle" class="tree-leaf">2</text>
  <text x="360" y="112" text-anchor="middle" class="tree-label">40</text>
  <text x="300" y="178" text-anchor="middle" class="tree-label">4</text>
  <text x="430" y="178" text-anchor="middle" class="tree-label">10</text>
  <text x="270" y="248" text-anchor="middle" class="tree-leaf">2</text>
  <text x="335" y="248" text-anchor="middle" class="tree-leaf">2</text>
  <text x="400" y="248" text-anchor="middle" class="tree-leaf">2</text>
  <text x="465" y="248" text-anchor="middle" class="tree-leaf">5</text>
</svg>`;

/* =========================================================
   QUESTION DATA — CORE PAPER (2026-27), 30 questions, 51 marks
   Unit 1 (Q1–9) = 15 · Unit 2 (Q10–16) = 13 · Unit 3 (Q17–30) = 23
   Every correct option is explicitly flagged with correct:true.
   ========================================================= */
const QUESTIONS = [
/* ---------------------------------------------------------- 1 */
{
  id:1, unit:1, marks:1, topic:"Place value · hundredths",
  body:`
    <p class="qlead">Circle the number below that has <strong>7 hundredths</strong>.</p>
    <div class="chips static"><span>5.7</span><span>5.07</span><span>5.70</span><span>5.007</span><span>50.7</span></div>`,
  solution:[
    `<p>After the decimal point the columns are <b>tenths</b>, <b>hundredths</b>, <b>thousandths</b>.</p>
     <table class="pv">
       <thead><tr><th>Ones</th><th>·</th><th>tenths</th><th>hundredths</th><th>thousandths</th></tr></thead>
       <tbody><tr><td>5</td><td class="dot">.</td><td>0</td><td class="hl">7</td><td>—</td></tr></tbody>
     </table>
     <p>“7 hundredths” means the digit <b>7</b> sits in the <b>second</b> column after the point.</p>`,
    `<p>Now check each option:</p>
     <ul class="tight">
       <li><b>5.7</b> (= 5.70) → 7 in the <i>tenths</i> column ✗</li>
       <li><b>5.07</b> → 0 tenths, <b>7 hundredths</b> ✓</li>
       <li><b>5.70</b> → 7 in the <i>tenths</i> column ✗</li>
       <li><b>5.007</b> → 7 in the <i>thousandths</i> column ✗</li>
       <li><b>50.7</b> → 7 in the <i>tenths</i> column ✗</li>
     </ul>`,
    `<p>Only one number has a 7 in the hundredths column.</p>
     <p><span class="answer">5.07</span></p>`
  ],
  practice:{
    type:"steps",
    prompt:"Practise finding hundredths in decimal numbers.",
    steps:[
      { prompt:"First, which column of a decimal number holds the hundredths?",
        options:[
          {text:"The second column after the decimal point", correct:true, fb:"Exactly — tenths come first, then hundredths."},
          {text:"The first column after the decimal point", fb:"That is the <b>tenths</b> column. Hundredths is one place further right."},
          {text:"The third column after the decimal point", fb:"That is the <b>thousandths</b> column — one place too far right."}
        ]},
      { prompt:"Which of these numbers has a <strong>4</strong> in the hundredths column?",
        options:[
          {text:"2.4", fb:"2.4 = 2.40 — the 4 is in the <b>tenths</b> column."},
          {text:"2.04", correct:true, fb:"2.04 = 2 ones and 4 hundredths. The 4 is in the hundredths column ✓"},
          {text:"2.40", fb:"2.40 is the same as 2.4 — the 4 is in the <b>tenths</b> column."},
          {text:"2.004", fb:"That is 4 <b>thousandths</b> (third column)."}
        ]}
    ]
  }
},
/* ---------------------------------------------------------- 2 */
{
  id:2, unit:1, marks:1, topic:"Place value · tens",
  body:`
    <p class="qlead">Circle the number below that has <strong>two tens</strong>.</p>
    <div class="chips static"><span>234</span><span>324</span><span>432</span><span>243</span><span>342</span></div>`,
  solution:[
    `<p>The tens column is the <b>second column from the right</b>: hundreds, <b>tens</b>, ones.</p>`,
    `<p>Look at <b>324</b>:</p>
     <table class="pv">
       <thead><tr><th>Hundreds</th><th>Tens</th><th>Ones</th></tr></thead>
       <tbody><tr><td>3</td><td class="hl">2</td><td>4</td></tr></tbody>
     </table>
     <p>The 2 is in the tens column, so it is worth <b>2 tens = 20</b>.</p>`,
    `<p>Check the others: 234 has 3 tens, 432 has 3 tens, 243 has 4 tens, 342 has 4 tens.</p>
     <p><span class="answer">324</span></p>`
  ],
  practice:{
    type:"steps",
    prompt:"Practise finding the tens digit in 3-digit numbers.",
    steps:[
      { prompt:"In the number 586, which digit is in the tens column?",
        options:[
          {text:"5", fb:"The 5 is in the <b>hundreds</b> column."},
          {text:"8", correct:true, fb:"Correct — the tens column is the second from the right."},
          {text:"6", fb:"The 6 is in the <b>ones</b> column."}
        ]},
      { prompt:"Which of these numbers has a <strong>6</strong> in the tens column?",
        options:[
          {text:"365", correct:true, fb:"365 = 3 hundreds, 6 tens, 5 ones ✓"},
          {text:"536", fb:"536 has 3 tens (the 6 is in the ones)."},
          {text:"653", fb:"653 has 5 tens."},
          {text:"356", fb:"356 has 5 tens."}
        ]}
    ]
  }
},
/* ---------------------------------------------------------- 3 */
{
  id:3, unit:1, marks:1, topic:"Writing numbers in digits",
  body:`<p class="qlead">Write the number “nine hundred thousand and fifty four” in digits.</p>`,
  solution:[
    `<p>Split the words into place-value chunks: <b>nine hundred thousand</b> and <b>fifty four</b>.</p>`,
    `<p>Set out the columns:</p>
     <table class="pv">
       <thead><tr><th>Hundred thousands</th><th>Ten thousands</th><th>Thousands</th><th>Hundreds</th><th>Tens</th><th>Ones</th></tr></thead>
       <tbody><tr><td>9</td><td>0</td><td>0</td><td>0</td><td>5</td><td>4</td></tr></tbody>
     </table>`,
    `<p>No thousands and no hundreds are mentioned, so those columns hold <b>0</b> as place holders.</p>
     <p><span class="answer">900 054</span></p>`
  ],
  practice:{
    type:"steps",
    prompt:"Write “three hundred thousand and twenty seven” in digits.",
    steps:[
      { prompt:"Which places are <b>not</b> mentioned in the words, so need 0 as a place holder?",
        options:[
          {text:"Hundreds and thousands", correct:true, fb:"Correct — we hear hundreds of thousands, then jump straight to tens and ones."},
          {text:"Tens and ones", fb:"“twenty seven” gives the tens and ones — they are mentioned."},
          {text:"Only the hundred-thousands", fb:"The hundred-thousands digit is 3 — that one is mentioned."}
        ]},
      { prompt:"Which of these is 300 027?",
        options:[
          {text:"300027", correct:true, fb:"300 027 = 3 hundred-thousands, 2 tens and 7 ones ✓"},
          {text:"30027", fb:"That is only five digits — it reads as thirty thousand and twenty seven."},
          {text:"3027", fb:"That is three thousand and twenty seven."},
          {text:"3000027", fb:"That is three million and twenty seven — one group too many."}
        ]}
    ]
  }
},
/* ---------------------------------------------------------- 4 */
{
  id:4, unit:1, marks:3, topic:"Multiplying & dividing by 10/100",
  body:`
    <p class="qlead">Work out:</p>
    <p class="qsub">a) 284 × 100</p>
    <p class="qsub">b) 0.48 × 10</p>
    <p class="qsub">c) 42 500 ÷ 10</p>`,
  solution:[
    `<p><b>a)</b> Multiplying by 100 makes the number 100 times bigger: every digit moves <b>two</b> places to the left.</p>
     <p>284 → 28 400 &nbsp; <span class="answer">28 400</span></p>`,
    `<p><b>b)</b> Multiplying by 10 moves every digit <b>one</b> place to the left.</p>

  body:`<p class="qlead">Work out <strong>3970 + 197</strong></p>`,
  solution:[
    `<p>Use a “make it friendly” strategy: 197 is close to 200.</p>
     <p>3970 + 197 = 3970 + 200 − 3</p>`,

    `<p>Now take away the extra 3: 4170 − 3 = 4167</p>
     <p><span class="answer">4167</span></p>`,
    `<p>Check with column addition: 3970 + 197 → ones 0 + 7 = 7, tens 7 + 9 = 16 (write 6, carry 1), hundreds 9 + 1 + 1 = 11 (write 1, carry 1), thousands 3 + 1 = 4. Same answer: 4167.</p>`
  ],

  body:`
    <p class="qlead">Fill in the gaps:</p>

    `<p><b>b)</b> Dividing by 10 once: 9700 ÷ 10 = 970. Again: 970 ÷ 10 = 97. Again: 97 ÷ 10 = 9.7.</p>
     <p>So we divided by 10 three times: 10 × 10 × 10 = 1000. &nbsp; <span class="answer">1000</span></p>`
  ],

{
  id:10, unit:2, marks:1, topic:"Commutativity",
  body:`
    <p class="qlead">Circle all the operations that are <strong>commutative</strong>.</p>
    <div class="chips static"><span>+</span><span>−</span><span>÷</span><span>×</span></div>`,
  solution:[
    `<p><b>Commutative</b> means you can swap the order of the numbers and still get the same answer: a + b = b + a.</p>`,
    `<p>Addition: 3 + 5 = 8 and 5 + 3 = 8 ✓<br>Multiplication: 4 × 6 = 24 and 6 × 4 = 24 ✓</p>`,
    `<p>Subtraction: 7 − 3 = 4 but 3 − 7 = −4 ✗<br>Division: 12 ÷ 4 = 3 but 4 ÷ 12 = 0.333… ✗</p>`,
    `<p><span class="answer">+ and ×</span></p>`
  ],
  practice:{
    type:"quick",
    items:[
      { q:"Which of these calculations is <b>not</b> commutative?",
        options:[
          {text:"5 + 9", fb:"5 + 9 = 9 + 5 = 14, so it is commutative."},
          {text:"3 × 8", fb:"3 × 8 = 8 × 3 = 24, so it is commutative."},
          {text:"10 − 4", correct:true, fb:"Correct: 10 − 4 = 6 but 4 − 10 = −6. The order matters."},
          {text:"7 × 2", fb:"7 × 2 = 2 × 7 = 14, so it is commutative."}
        ]},
      { q:"Which statement correctly shows commutativity?",
        options:[
          {text:"9 − 3 = 3 − 9", fb:"That is false: 6 ≠ −6, so it shows subtraction is <b>not</b> commutative."},
          {text:"8 ÷ 2 = 2 ÷ 8", fb:"That is false: 4 ≠ 0.25."},
          {text:"6 + 4 = 4 + 6", correct:true, fb:"Correct: both sides equal 10."},
          {text:"10 − 5 = 5 − 10", fb:"That is false: 5 ≠ −5."}
        ]},
      { q:"Sam says “12 ÷ 3 = 4, so 3 ÷ 12 = 4”. What has gone wrong?",
        options:[
          {text:"Division is not commutative — 3 ÷ 12 = 0.25", correct:true, fb:"Correct. You cannot swap the order in a division."},
          {text:"Nothing — both answers are 4", fb:"Try it: 3 ÷ 12 means 3 shared into 12 parts, which is 0.25."},
          {text:"He should have used multiplication", fb:"Multiplication is commutative, but the question is about division."},
          {text:"3 ÷ 12 = 9", fb:"Division does not subtract — 3 ÷ 12 = 0.25."}
        ]}
    ]
  }
},

{
  id:25, unit:3, marks:2, topic:"Prime factorisation",
  body:`
    <p class="qlead">Write <strong>80</strong> as a product of prime factors.</p>
    <p class="qnote">Hint: complete the factor tree first.</p>
    ${factorTreeCore}`,
  solution:[
    `<p>Follow the tree: 80 splits into <b>2</b> and <b>40</b>.</p>
     <p>40 splits into <b>4</b> and <b>10</b>.</p>
     <p>4 splits into <b>2</b> and <b>2</b>; 10 splits into <b>2</b> and <b>5</b>.</p>`,
    `<p>The circled branches are all prime, so we stop. Reading the leaves:</p>
     <p>80 = 2 × 2 × 2 × 2 × 5</p>`,
    `<p>Check: 2 × 2 × 2 × 2 = 16 and 16 × 5 = 80 ✓</p>
     <p><span class="answer">80 = 2⁴ × 5</span></p>`
  ],
  practice:{
    type:"steps",
    prompt:"Write <strong>36</strong> as a product of prime factors.",
    steps:[
      { prompt:"Which is a correct first factor pair for 36 (not 1 × 36)?",
        options:[
          {text:"6 × 6", correct:true, fb:"Correct — and both 6s split further."},
          {text:"4 × 8", fb:"4 × 8 = 32, not 36."},
          {text:"2 × 16", fb:"2 × 16 = 32, not 36."},
          {text:"5 × 7", fb:"5 × 7 = 35, not 36."}
        ]},
      { prompt:"Now split 6 × 6 into primes. What do you get?",
        options:[
          {text:"2 × 3 × 2 × 3", correct:true, fb:"Correct: each 6 becomes 2 × 3."},
          {text:"3 × 3", fb:"You have left out the 2s from each 6."},
          {text:"6 × 6", fb:"6 is not prime — keep splitting."},
          {text:"2 × 2 × 3", fb:"That multiplies to 12, not 36."}
        ]},
      { prompt:"So 36 = ?",
        options:[
          {text:"2² × 3²", correct:true, fb:"Correct: 2 × 2 × 3 × 3 = 36."},
          {text:"2 × 3", fb:"That is 6."},
          {text:"2 × 2 × 3", fb:"That is 12 — you need two 3s."},
          {text:"2³ × 3", fb:"That is 24."}
        ]}
    ]
  }
},

{

  body:`
    <p class="qlead">Lana is thinking of a number. She says:</p>
    <p class="qlead"><em>“My number is between 10 and 50. It has exactly three factors.”</em></p>
    <p class="qlead">Find the two possible numbers Lana could be thinking of.</p>`,
  solution:[
    `<p>Factors normally come in pairs (1 × n, 2 × n/2, …), so most numbers have an <b>even</b> number of factors.</p>
     <p>A number has an <b>odd</b> number of factors only when it is a <b>square number</b> (the middle pair repeats).</p>`,
    `<p>Exactly <b>three</b> factors happens when the number is the square of a <b>prime</b>: p × p.</p>
     <p>The factors are then 1, p and p².</p>`,
    `<p>Prime squares between 10 and 50:</p>
     <ul class="tight">
       <li>3² = 9 — too small</li>
       <li>5² = 25 → factors 1, 5, 25 ✓</li>
       <li>7² = 49 → factors 1, 7, 49 ✓</li>
       <li>11² = 121 — too big</li>
     </ul>`,
    `<p><span class="answer">25 and 49</span></p>`
  ],

/* ---------------------------------------------------------- 29 */
{
  id:29, unit:3, marks:2, topic:"Reasoning with primes",
  body:`
    <p class="qlead">Three prime numbers add up to <strong>30</strong>.</p>
    <p class="qlead">Give an example of what the three prime numbers could be.</p>`,
  solution:[
    `<p>Every prime except 2 is <b>odd</b>. Odd + odd + odd = <b>odd</b>, so three odd primes can never make the even number 30.</p>`,
    `<p>So one of the primes <b>must be 2</b>. The other two must add to 28.</p>`,
    `<p>Prime pairs that add to 28:</p>
     <ul class="tight">
       <li>5 + 23 = 28 ✓ (both prime)</li>
       <li>11 + 17 = 28 ✓ (both prime)</li>
     </ul>`,
    `<p><span class="answer">e.g. 2, 5, 23 &nbsp; or &nbsp; 2, 11, 17</span></p>`
  ],
  practice:{
    type:"steps",
    prompt:"Three prime numbers add up to <strong>20</strong>.",
    steps:[
      { prompt:"Why must one of the primes be 2?",
        options:[
          {text:"Because the total is even and odd + odd + odd is odd", correct:true, fb:"Correct — without a 2 the total would be odd."},
          {text:"Because 2 is the smallest prime", fb:"That is true, but it is not the reason here."},
          {text:"Because 20 is a multiple of 2", fb:"That alone does not force one of the addends to be 2."},
          {text:"It does not have to be", fb:"Try 3 + 7 + 11 = 21 and 5 + 7 + 11 = 23 — all odd totals."}
        ]},
      { prompt:"Which set of three primes adds up to 20?",
        options:[
          {text:"2, 7, 11", correct:true, fb:"Correct: 2 + 7 + 11 = 20."},
          {text:"3, 5, 11", fb:"That gives 19 — and an odd total."},
          {text:"2, 5, 11", fb:"That gives 18."},
          {text:"5, 7, 11", fb:"That gives 23, and all three are odd."}
        ]}
    ]
  }
},
/* ---------------------------------------------------------- 30 */
{
  id:30, unit:3, marks:2, topic:"Reasoning · HCF and LCM",
  body:`
    <p class="qlead">The highest common factor (HCF) of two numbers is <strong>6</strong>. Their lowest common multiple (LCM) is <strong>72</strong>.</p>
    <p class="qlead">Both numbers are greater than 6. What are the two numbers?</p>`,
  solution:[
    `<p>Both numbers are multiples of 6, so write them as 6a and 6b, where a and b share no common factor.</p>`,
    `<p>Use the fact: HCF × LCM = product of the two numbers.</p>
     <p>6 × 72 = 432, so 6a × 6b = 432 → 36ab = 432 → ab = 12.</p>`,
    `<p>Pairs multiplying to 12:</p>
     <ul class="tight">
       <li>1 and 12 → numbers 6 and 72 ✗ (6 is not greater than 6)</li>
       <li>2 and 6 → not coprime, so the HCF would be 12 ✗</li>
       <li>3 and 4 → coprime ✓ → numbers 18 and 24</li>
     </ul>`,
    `<p>Check: HCF(18, 24) = 6 ✓ &nbsp; LCM(18, 24) = 72 ✓</p>
     <p><span class="answer">18 and 24</span></p>`
  ],
  practice:{
    type:"steps",
    prompt:"The HCF of two numbers is <strong>4</strong> and their LCM is <strong>24</strong>. Both numbers are greater than 4.",
    steps:[
      { prompt:"Which fact links the HCF and LCM to the two numbers?",
        options:[
          {text:"HCF × LCM = the product of the two numbers", correct:true, fb:"Correct — this is the key relationship."},
          {text:"HCF + LCM = the sum of the numbers", fb:"That is not a valid rule."},
          {text:"HCF − LCM = the difference", fb:"That is not a valid rule."},
          {text:"LCM ÷ HCF = 1", fb:"Here 24 ÷ 4 = 6, not 1."}
        ]},
      { prompt:"The two numbers multiply to 4 × 24 = 96. Which pair works (both greater than 4)?",
        options:[
          {text:"8 and 12", correct:true, fb:"Correct: HCF(8, 12) = 4 and LCM(8, 12) = 24 ✓"},
          {text:"4 and 24", fb:"The HCF would be 4, but 4 is not greater than 4."},
          {text:"6 and 16", fb:"HCF(6, 16) = 2, not 4."},
          {text:"2 and 48", fb:"HCF(2, 48) = 2, and 2 is not greater than 4."}

/* =========================================================
   STATE
   ========================================================= */
const STATE = { current: 1, q: {} };
const COMPLETED = new Set();

function initPracticeState(p){
  if (p.type === "steps") return { step: 0, ans: {}, wrong: null };
  if (p.type === "quick") return { ans: {}, wrong: null };
  if (p.type === "multi") return { sel: [], checked: false };
  return {};
}
function getState(id){
  if (!STATE.q[id]){
    const q = QUESTIONS.find(x => x.id === id);
    STATE.q[id] = { sol: 0, pr: initPracticeState(q.practice) };
  }
  return STATE.q[id];
}

/* =========================================================
   RENDERERS
   ========================================================= */
function fbBox(html, ok){
  return `<div class="fb ${ok ? "ok" : "no"}"><span class="fbi">${ok ? "✓" : "!"}</span><div>${html}</div></div>`;
}

function solHTML(q, st){
  const total = q.solution.length;
  let html = q.solution.map((s, i) => `
    <div class="sol-step ${i < st.sol ? "show" : ""}">
      <div class="sol-num">${i + 1}</div>
      <div class="sol-body">${s}</div>
    </div>`).join("");

  if (st.sol < total){
    html += `<div class="sol-actions">
      <button class="btn primary" data-act="sol-next">${st.sol === 0 ? "Show step 1" : "Show step " + (st.sol + 1)} →</button>
      <button class="btn ghost" data-act="sol-all">Show all steps</button>
    </div>`;
  } else {
    html += `<div class="sol-done">✓ All ${total} steps shown</div>`;
  }
  return html;
}

function optionButtons(options, {step, done, ans, wrongPick, qindex}){
  return options.map((o, j) => {
    let cls = "";
    if (done && j === ans) cls = "correct";
    if (!done && j === wrongPick) cls = "wrong";
    const data = step === undefined
      ? `data-act="qopt" data-qi="${qindex}" data-oi="${j}"`
      : `data-act="opt" data-step="${step}" data-opt="${j}"`;
    return `<button class="opt ${cls}" ${data} ${done ? "disabled" : ""}>${o.text}</button>`;
  }).join("");
}

function practiceHTML(q, st){
  const p = q.practice, ps = st.pr;
  const tip = `<div class="ptip">Try a similar question. Choose an answer at each step — you will get feedback straight away, and the next step unlocks when you are right.</div>`;

  if (p.type === "steps"){
    let html = tip + `<div class="pstat"><span class="ptag">Similar question</span>${p.prompt}${p.svg || ""}</div>`;
    p.steps.forEach((s, i) => {
      if (i > ps.step) return;
      const done = ps.ans[i] !== undefined;
      const wrongPick = (!done && ps.wrong && ps.wrong.i === i) ? ps.wrong.j : -1;
      html += `<div class="pstep ${done ? "done" : ""}">
        <div class="pstep-h"><span class="badge">Step ${i + 1}</span></div>
        <div class="pstep-q">${s.prompt}</div>
        <div class="opts">${optionButtons(s.options, {step: i, done, ans: ps.ans[i], wrongPick})}</div>
        ${done ? fbBox(s.options[ps.ans[i]].fb, true)
               : (wrongPick >= 0 ? fbBox(s.options[wrongPick].fb, false) : "")}
      </div>`;
    });
    return html;
  }

  if (p.type === "quick"){
    return tip + p.items.map((it, i) => {
      const done = ps.ans[i] !== undefined;
      const wrongPick = (!done && ps.wrong && ps.wrong.i === i) ? ps.wrong.j : -1;
      return `<div class="qitem">
        <div class="qitem-h"><span class="badge">${it.label || ("Question " + (i + 1))}</span></div>
        <div class="qitem-q">${it.q}</div>
        <div class="opts">${optionButtons(it.options, {done, ans: ps.ans[i], wrongPick, qindex: i})}</div>
        ${done ? fbBox(it.options[ps.ans[i]].fb, true)
               : (wrongPick >= 0 ? fbBox(it.options[wrongPick].fb, false) : "")}
      </div>`;
    }).join("");
  }

  if (p.type === "multi"){
    const checked = ps.checked;
    const chips = p.items.map((it, i) => {
      const sel = ps.sel.includes(i);
      let cls = sel ? "sel" : "";
      if (checked){
        if (it.ok && sel) cls = "m-correct";
        else if (it.ok && !sel) cls = "m-missed";
        else if (!it.ok && sel) cls = "m-wrong";
        else cls = "";
      }
      return `<button class="mchip ${cls}" data-act="mtoggle" data-i="${i}" ${checked ? "disabled" : ""}>${it.v}</button>`;
    }).join("");

    let feedback = "";
    if (checked){
      const missed = p.items.filter((it, i) => it.ok && !ps.sel.includes(i));
      const wrong = p.items.filter((it, i) => !it.ok && ps.sel.includes(i));
      if (!missed.length && !wrong.length){
        feedback = fbBox(`<b>All correct!</b> ${p.strategy || ""}`, true);
      } else {
        let msg = "";
        if (missed.length) msg += `<b>You missed:</b> ` + missed.map(m => `${m.v} (${m.note})`).join("; ") + ". ";
        if (wrong.length) msg += `<b>These are not in the set:</b> ` + wrong.map(m => `${m.v} (${m.note})`).join("; ") + ". ";
        if (p.strategy) msg += `<br><b>Remember:</b> ${p.strategy}`;
        feedback = fbBox(msg, false) + `<div style="margin-top:10px"><button class="btn ghost" data-act="mtry">Try again</button></div>`;
      }
    }

    return tip + `<div class="qitem">
      <div class="qitem-q">${p.q}</div>
      <div class="chips pick">${chips}</div>
      ${checked ? "" : `<button class="btn primary check" data-act="mcheck">Check answers</button>`}
      ${feedback}
    </div>`;
  }
  return "";
}

/* =========================================================
   MAIN RENDER
   ========================================================= */
const main = document.getElementById("main");
const side = document.getElementById("side");

function render(){
  const q = QUESTIONS[STATE.current - 1];
  const st = getState(q.id);

  main.innerHTML = `
    <article class="card">
      <header class="qhead">
        <div><span class="qnum">Question ${q.id}</span><span class="qtopic">${q.topic}</span></div>
        <div class="qmeta">
          <span class="pill">Unit ${q.unit}</span>
          <span class="pill marks">${q.marks} ${q.marks === 1 ? "mark" : "marks"}</span>
        </div>
      </header>
      <div class="qbody">${q.body}</div>
      <div class="panels">
        <section class="panel solution">
          <h3 class="panel-h"><span class="ic">🧩</span> Worked solution <span class="tag">reveal step by step</span></h3>
          <div id="solSteps">${solHTML(q, st)}</div>
        </section>
        <section class="panel practice">
          <h3 class="panel-h"><span class="ic">✏️</span> Your turn <span class="tag">similar question</span></h3>
          <div id="practiceBody">${practiceHTML(q, st)}</div>
        </section>
      </div>
      <footer class="qfoot">
        <button class="btn ghost" data-act="prev" ${STATE.current === 1 ? "disabled" : ""}>← Previous</button>
        <span class="mid">Question ${q.id} of 30</span>
        <button class="btn primary" data-act="next" ${STATE.current === 30 ? "disabled" : ""}>Next →</button>
      </footer>
    </article>`;

  document.querySelectorAll(".navbtn").forEach(b => {
    b.classList.toggle("active", Number(b.dataset.q) === q.id);
  });
  window.scrollTo({top: 0, behavior: "smooth"});
}

function refreshSolution(){
  const q = QUESTIONS[STATE.current - 1];
  document.getElementById("solSteps").innerHTML = solHTML(q, getState(q.id));
}
function refreshPractice(){
  const q = QUESTIONS[STATE.current - 1];
  document.getElementById("practiceBody").innerHTML = practiceHTML(q, getState(q.id));
  checkComplete(q);
}

/* =========================================================
   COMPLETION TRACKING
   ========================================================= */
function checkComplete(q){
  const ps = getState(q.id).pr, p = q.practice;
  let done = false;
  if (p.type === "steps") done = Object.keys(ps.ans).length === p.steps.length;
  if (p.type === "quick") done = Object.keys(ps.ans).length === p.items.length;
  if (p.type === "multi"){
    done = ps.checked && p.items.every((it, i) => it.ok === ps.sel.includes(i));
  }
  if (done) COMPLETED.add(q.id);
  updateProgress();
}

function updateProgress(){
  const n = COMPLETED.size;
  document.getElementById("doneCount").textContent = n;
  document.getElementById("barFill").style.width = (n / 30 * 100) + "%";
  document.querySelectorAll(".navbtn").forEach(b => {
    b.classList.toggle("done", COMPLETED.has(Number(b.dataset.q)));
  });
}

/* =========================================================
   NAV
   ========================================================= */
function buildNav(){
  const units = [
    {n: 1, label: "Unit 1 · Decimal number system", range: [1, 9]},
    {n: 2, label: "Unit 2 · Properties of arithmetic", range: [10, 16]},
    {n: 3, label: "Unit 3 · Factors and multiples", range: [17, 30]}
  ];
  let html = "";
  units.forEach(u => {
    html += `<h2>${u.label}</h2><div class="navgrid">`;
    for (let i = u.range[0]; i <= u.range[1]; i++){
      const q = QUESTIONS[i - 1];
      html += `<button class="navbtn" data-q="${i}" title="Q${i}: ${q.topic}">${i}</button>`;
    }
    html += `</div>`;
  });
  side.innerHTML = html;
  side.querySelectorAll(".navbtn").forEach(b => {
    b.addEventListener("click", () => {
      STATE.current = Number(b.dataset.q);
      render();
      updateProgress();
    });
  });
}

/* =========================================================
   EVENTS
   ========================================================= */
main.addEventListener("click", (e) => {
  const btn = e.target.closest("[data-act]");
  if (!btn) return;
  const act = btn.dataset.act;
  const q = QUESTIONS[STATE.current - 1];
  const st = getState(q.id);
  const p = q.practice, ps = st.pr;

  if (act === "prev"){ STATE.current = Math.max(1, STATE.current - 1); render(); return; }
  if (act === "next"){ STATE.current = Math.min(30, STATE.current + 1); render(); return; }

  if (act === "sol-next"){
    if (st.sol < q.solution.length) st.sol++;
    refreshSolution();
    return;
  }
  if (act === "sol-all"){
    st.sol = q.solution.length;
    refreshSolution();
    return;
  }

  /* step practice */
  if (act === "opt"){
    const i = Number(btn.dataset.step);
    const j = Number(btn.dataset.opt);
    if (isCorrectOption(p.steps[i], j)){
      ps.ans[i] = j;
      ps.wrong = null;
      ps.step = Math.max(ps.step, i + 1);
    } else {
      ps.wrong = {i, j};
    }
    refreshPractice();
    return;
  }

  /* quick practice */
  if (act === "qopt"){
    const i = Number(btn.dataset.qi);
    const j = Number(btn.dataset.oi);
    if (isCorrectOption(p.items[i], j)){
      ps.ans[i] = j;
      ps.wrong = null;
    } else {
      ps.wrong = {i, j};
    }
    refreshPractice();
    return;
  }

  /* multi-select */
  if (act === "mtoggle"){
    const i = Number(btn.dataset.i);
    const at = ps.sel.indexOf(i);
    if (at >= 0) ps.sel.splice(at, 1); else ps.sel.push(i);
    refreshPractice();
    return;
  }
  if (act === "mcheck"){
    ps.checked = true;
    refreshPractice();
    return;
  }
  if (act === "mtry"){
    ps.sel = [];
    ps.checked = false;
    refreshPractice();
    return;
  }
});

/* Is option j the correct one?  Explicit flag first, then a safe
   fallback so a missing flag can never silently mark a right answer wrong. */
function isCorrectOption(stepOrItem, j){
  const opts = stepOrItem.options;
  if (opts[j].correct === true) return true;
  if (opts.some(o => o.correct === true)) return false;
  return /^Correct|^Exactly|^Yes|^Perfect/i.test(opts[j].fb || "");
}

/* =========================================================
   BOOT
   ========================================================= */
buildNav();
updateProgress();
render();
</script>
</body>
</html>
